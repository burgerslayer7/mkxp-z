name: RGSS-NX Switch M1

on:
  workflow_dispatch:
  push:
    branches: ['rgss-nx/**']
    paths:
      - 'rgss-nx/**'
      - 'tools/rgss-nx/**'
      - 'docs/rgss-nx/**'
      - 'docs/psdk-nx/**'
      - 'libretro/**'
      - 'src/**'
      - 'binding/**'
      - 'binding-sandbox/**'
      - 'meson.build'
      - 'meson_options.txt'
      - '.github/workflows/rgss-nx-switch.yml'

permissions:
  contents: write

jobs:
  stage1:
    name: RGSS-NX stage 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential automake libtool zip universal-ctags ruby

      - name: WASI SDK 30
        run: |
          curl -L -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          mkdir "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1

      - name: Binaryen 126
        run: |
          curl -L -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz
          mkdir "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP/binaryen" --strip-components=1

      - name: Build stage 1
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          {
            cd libretro
            CLICOLOR_FORCE=1 make -j "$(nproc)" \
              WASI_SDK="$RUNNER_TEMP/wasi-sdk" \
              WASM_OPT="$RUNNER_TEMP/binaryen/bin/wasm-opt"
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/stage1.log"

      - name: Upload stage 1 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgss-nx-stage1-logs
          path: ci-logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: rgss-nx-stage1
          path: libretro/build/libretro-stage1

  switch:
    name: RGSS-NX Nintendo Switch M1
    needs: stage1
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: -u root
    steps:
      - name: Prepare log directory
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/ci-logs"

      - name: Install host tools
        shell: bash
        run: |
          set -o pipefail
          {
            curl -L -o ~/Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
            bash ~/Miniforge3.sh -b -p ~/miniforge3
            source ~/miniforge3/etc/profile.d/conda.sh
            conda install -y git meson cmake python
            echo "$HOME/miniforge3/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/switch.log"

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: rgss-nx-stage1
          path: libretro/build/libretro-stage1

      - name: Build mkxp-z core for libnx
        shell: bash
        run: |
          set -euo pipefail
          {
            git config --global --add safe.directory "$(pwd)"
            CLICOLOR_FORCE=1 meson setup build \
              --cross-file libretro/meson-switch.txt \
              --buildtype release \
              -Db_lto=true \
              -Dlibretro=true \
              -Dlibretro_save_states=true
            cd build
            CLICOLOR_FORCE=1 ninja -v
            cp mkxp-z_libretro.a "$RUNNER_TEMP/libretro_libnx.a"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/switch.log"

      - name: Resolve RetroArch version
        id: retroarch
        shell: bash
        run: |
          set -euo pipefail
          tag_name=$(curl -fsSL https://api.github.com/repos/libretro/RetroArch/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          test -n "$tag_name"
          echo "tag=$tag_name" >> "$GITHUB_OUTPUT"
          echo "RetroArch=$tag_name" | tee -a "$GITHUB_WORKSPACE/ci-logs/switch.log"

      - name: Build isolated generic RGSS-NX frontend
        shell: bash
        env:
          RA_TAG: ${{ steps.retroarch.outputs.tag }}
        run: |
          set -euo pipefail
          {
            cd "$RUNNER_TEMP"
            git clone https://github.com/libretro/RetroArch retroarch-generic --depth 1 -b "$RA_TAG"
            cp libretro_libnx.a retroarch-generic/
            cd retroarch-generic

            if [ "$RA_TAG" = 'v1.22.2' ] && [ -f "$GITHUB_WORKSPACE/libretro/retroarch-pr18459.patch" ]; then
              git apply "$GITHUB_WORKSPACE/libretro/retroarch-pr18459.patch"
            fi

            python - <<'PY'
          from pathlib import Path

          platform = Path('frontend/drivers/platform_switch.c')
          text = platform.read_text()
          old = '         g_defaults.dirs[DEFAULT_DIR_PORT],\n         FILE_PATH_MAIN_CONFIG,'
          new = '         "romfs:/retroarch",\n         FILE_PATH_MAIN_CONFIG,'
          if old not in text:
              raise SystemExit('RGSS-NX: RetroArch Switch config-path anchor not found')
          platform.write_text(text.replace(old, new, 1))

          retroarch = Path('retroarch.c')
          text = retroarch.read_text()
          old = 'int main(int argc, char *argv[])\n{\n   return rarch_main(argc, argv, NULL);\n}'
          new = 'int main(int argc, char *argv[])\n{\n   romfsInit();\n   return rarch_main(argc, argv, NULL);\n}'
          if old not in text:
              raise SystemExit('RGSS-NX: RetroArch libnx main anchor not found')
          retroarch.write_text(text.replace(old, new, 1))
          PY

            CLICOLOR_FORCE=1 make -j "$(nproc)" -f Makefile.libnx LIBRETRO=mkxp-z

            mkdir -p "$GITHUB_WORKSPACE/dist/sd/switch/RGSS-NX"
            /opt/devkitpro/tools/bin/nacptool --create "RGSS-NX" "RGSS-NX contributors" "0.2.2" "$RUNNER_TEMP/rgss-nx.nacp"
            /opt/devkitpro/tools/bin/elf2nro retroarch_switch.elf \
              "$GITHUB_WORKSPACE/dist/sd/switch/RGSS-NX/RGSS-NX.nro" \
              --romfsdir="$GITHUB_WORKSPACE/rgss-nx/switch/romfs" \
              --nacp="$RUNNER_TEMP/rgss-nx.nacp"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/switch.log"

      - name: Build Infinite Fusion 2 direct launcher
        shell: bash
        env:
          RA_TAG: ${{ steps.retroarch.outputs.tag }}
        run: |
          set -euo pipefail
          {
            cd "$RUNNER_TEMP"
            git clone https://github.com/libretro/RetroArch retroarch-if2 --depth 1 -b "$RA_TAG"
            cp libretro_libnx.a retroarch-if2/
            cd retroarch-if2

            if [ "$RA_TAG" = 'v1.22.2' ] && [ -f "$GITHUB_WORKSPACE/libretro/retroarch-pr18459.patch" ]; then
              git apply "$GITHUB_WORKSPACE/libretro/retroarch-pr18459.patch"
            fi

            python - <<'PY'
          from pathlib import Path

          platform = Path('frontend/drivers/platform_switch.c')
          text = platform.read_text()
          old = '         g_defaults.dirs[DEFAULT_DIR_PORT],\n         FILE_PATH_MAIN_CONFIG,'
          new = '         "romfs:/retroarch",\n         FILE_PATH_MAIN_CONFIG,'
          if old not in text:
              raise SystemExit('RGSS-NX: RetroArch Switch config-path anchor not found')
          platform.write_text(text.replace(old, new, 1))

          retroarch = Path('retroarch.c')
          text = retroarch.read_text()
          old = 'int main(int argc, char *argv[])\n{\n   return rarch_main(argc, argv, NULL);\n}'
          new = '''int main(int argc, char *argv[])
          {
             static char *rgss_nx_argv[] = {NULL, NULL, NULL};
             romfsInit();
             rgss_nx_argv[0] = strdup("retroarch");
             rgss_nx_argv[1] = strdup("sdmc:/switch/RGSS-NX/games/InfiniteFusion2/Game.ini");
             argc = 2;
             argv = rgss_nx_argv;
             return rarch_main(argc, argv, NULL);
          }'''
          if old not in text:
              raise SystemExit('RGSS-NX: RetroArch libnx main anchor not found')
          retroarch.write_text(text.replace(old, new, 1))
          PY

            CLICOLOR_FORCE=1 make -j "$(nproc)" -f Makefile.libnx LIBRETRO=mkxp-z

            /opt/devkitpro/tools/bin/nacptool --create "RGSS-NX IF2" "RGSS-NX contributors" "0.2.2" "$RUNNER_TEMP/rgss-nx-if2.nacp"
            /opt/devkitpro/tools/bin/elf2nro retroarch_switch.elf \
              "$GITHUB_WORKSPACE/dist/sd/switch/RGSS-NX/RGSS-NX-IF2.nro" \
              --romfsdir="$GITHUB_WORKSPACE/rgss-nx/switch/romfs" \
              --nacp="$RUNNER_TEMP/rgss-nx-if2.nacp"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-logs/switch.log"

      - name: Package runtime, installer and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/sd/switch/RGSS-NX/system/mkxp-z/Scripts/Preload
          mkdir -p dist/compat/preload dist/smoke-test

          cp rgss-nx/compat/preload/rgss_nx_bootstrap.rb \
            dist/sd/switch/RGSS-NX/system/mkxp-z/Scripts/Preload/
          cp rgss-nx/compat/preload/rgss_nx_bootstrap.rb dist/compat/preload/
          cp rgss-nx/smoke-test/mkxp.json rgss-nx/smoke-test/smoke.rb dist/smoke-test/
          cp tools/rgss-nx/Install-Game.ps1 dist/
          cp tools/rgss-nx/Inspect-Game.ps1 dist/
          cp docs/rgss-nx/INFINITE_FUSION_2.md dist/
          cp docs/rgss-nx/TEST_PROTOCOL.md dist/

      - name: Verify M1 package
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/sd/switch/RGSS-NX/RGSS-NX.nro
          test -s dist/sd/switch/RGSS-NX/RGSS-NX-IF2.nro
          test -s dist/sd/switch/RGSS-NX/system/mkxp-z/Scripts/Preload/rgss_nx_bootstrap.rb
          test -s dist/Install-Game.ps1
          grep -q 'InfiniteFusion2/Game.ini' .github/workflows/rgss-nx-switch.yml
          find dist -maxdepth 9 -type f -print

      - name: Upload Switch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgss-nx-switch-logs
          path: ci-logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: RGSS-NX-M1-Switch
          path: dist

  publish:
    name: Publish NROs to branch
    if: always()
    needs: [stage1, switch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download successful package
        if: needs.switch.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: RGSS-NX-M1-Switch
          path: .ci-package

      - name: Download CI logs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: rgss-nx-*-logs
          path: .ci-logs
          merge-multiple: true

      - name: Prepare published output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          rm -rf artifacts/ci-logs
          mkdir -p artifacts/ci-logs

          if [ -d .ci-logs ]; then
            cp -R .ci-logs/. artifacts/ci-logs/ || true
          fi

          if [ "${{ needs.switch.result }}" = "success" ]; then
            test -s .ci-package/sd/switch/RGSS-NX/RGSS-NX.nro
            test -s .ci-package/sd/switch/RGSS-NX/RGSS-NX-IF2.nro
            cp .ci-package/sd/switch/RGSS-NX/RGSS-NX.nro artifacts/RGSS-NX.nro
            cp .ci-package/sd/switch/RGSS-NX/RGSS-NX-IF2.nro artifacts/RGSS-NX-IF2.nro
          else
            rm -f artifacts/RGSS-NX.nro artifacts/RGSS-NX-IF2.nro
          fi

          {
            echo '# RGSS-NX CI build status'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "Stage 1: ${{ needs.stage1.result }}"
            echo "Switch: ${{ needs.switch.result }}"
            echo "Published: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > artifacts/BUILD_STATUS.md

      - name: Commit published output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- artifacts/BUILD_STATUS.md
          if [ -f artifacts/RGSS-NX.nro ]; then git add -- artifacts/RGSS-NX.nro; fi
          if [ -f artifacts/RGSS-NX-IF2.nro ]; then git add -- artifacts/RGSS-NX-IF2.nro; fi
          if [ -d artifacts/ci-logs ]; then git add -- artifacts/ci-logs; fi

          if git diff --cached --quiet; then
            echo 'No published output changes.'
            exit 0
          fi

          git commit -m 'ci: publish RGSS-NX Switch build [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"
