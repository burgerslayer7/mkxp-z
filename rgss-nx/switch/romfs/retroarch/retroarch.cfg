# RGSS-NX dedicated RetroArch/libnx configuration.
# The mkxp-z core is statically linked into the NRO.

menu_driver = "rgui"
rgui_browser_directory = "sdmc:/switch/RGSS-NX/games"

# Core options are bundled in RomFS so RGSS-NX compatibility is deterministic.
rgui_config_directory = "romfs:/retroarch/config"

# The mkxp-z core appends /mkxp-z to this directory and mounts it as /System.
system_directory = "sdmc:/switch/RGSS-NX/system"
savefile_directory = "sdmc:/switch/RGSS-NX/saves"
savestate_directory = "sdmc:/switch/RGSS-NX/states"
screenshot_directory = "sdmc:/switch/RGSS-NX/screenshots"
recording_output_directory = "sdmc:/switch/RGSS-NX/recordings"
log_dir = "sdmc:/switch/RGSS-NX/logs"
input_remapping_directory = "sdmc:/switch/RGSS-NX/config/remaps"

# Avoid references to RetroArch assets which are not shipped with this dedicated frontend.
assets_directory = ""
video_shader_dir = ""
video_filter_dir = ""
audio_filter_dir = ""
overlay_directory = ""
osk_overlay_directory = ""
thumbnails_directory = ""

# Handheld-friendly defaults.
video_fullscreen = "true"
video_threaded = "false"
input_autodetect_enable = "true"
menu_show_load_core = "false"
menu_show_load_content = "true"
menu_show_information = "true"

# Keep saves writable and independent from embedded RomFS.
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
